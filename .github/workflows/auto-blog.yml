# Weekly auto blog deployer.
#
# Generates the next queued article with Groq, verifies the site still builds,
# then commits it to main. Cloudflare Pages picks up the push and deploys.
#
# Requires repo secret: GROQ_API_KEY  (Settings → Secrets and variables → Actions)
# Optional repo variable: GROQ_MODEL  (defaults to llama-3.3-70b-versatile)
name: Auto blog

on:
  schedule:
    # 04:00 UTC every Tuesday = 09:30 IST. Cron here is always UTC.
    - cron: '0 4 * * 2'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Force a specific topic slug (optional)'
        required: false
        type: string
      dry_run:
        description: 'Generate and print only — do not commit'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: auto-blog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate article
        id: generate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.slug }}" ]; then ARGS="$ARGS --slug=${{ inputs.slug }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node scripts/generate-blog.mjs $ARGS

      - name: Verify the site still builds
        if: steps.generate.outputs.published == 'true'
        run: npm run build

      - name: Commit and push
        if: steps.generate.outputs.published == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/blog
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "content: publish ${{ steps.generate.outputs.slug }}

          ${{ steps.generate.outputs.title }}

          Auto-generated by .github/workflows/auto-blog.yml"
          git push

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.generate.outputs.published }}" = "true" ]; then
            echo "### Published :rocket:" >> $GITHUB_STEP_SUMMARY
            echo "**${{ steps.generate.outputs.title }}**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "https://shivrajsinh.in/blog/${{ steps.generate.outputs.slug }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "No article published this run — check the generate step log." >> $GITHUB_STEP_SUMMARY
          fi
